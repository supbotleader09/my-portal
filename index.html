<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download with Countdown</title>
    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        /* Container for the download message */
        .download-message {
            font-size: 20px;
            color: #333;
            margin: 20px;
        }

        /* Styling for the "..." animation */
        .dots {
            font-size: 25px;
            color: #28a745;
        }

        /* Animation for dots */
        @keyframes dot-blink {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
            100% { content: "."; }
        }

        .dots::after {
            content: ".";
            animation: dot-blink 1.5s infinite;
        }

        /* Styling for the button */
        #downloadBtn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #downloadBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<h2>Download Our App</h2>
<!-- Button to trigger download -->
<button id="downloadBtn">Download APK</button>

<!-- Message to be shown during download process -->
<div id="message" class="download-message" style="display: none;">
    আপনার এপ ডাউনলোড প্রক্রিয়াধীন রয়েছে, কিছুক্ষণ অপেক্ষা করুন <span class="dots"></span>
</div>

<script>
// Get the countdown and message elements
var message = document.getElementById("message");
var downloadBtn = document.getElementById("downloadBtn");

// Define the download link (Google Drive link)
var downloadLink = "https://drive.google.com/uc?export=download&id=13QMZ28PAOqq0UFkwYM_bIjVRefp88QTn";

// Function to handle the download and show the message
downloadBtn.onclick = function() {
    // Show the message and start the animation
    downloadBtn.disabled = true;  // Disable the button
    message.style.display = "block";  // Show the message

    // Simulate the time delay for download link redirection (can be adjusted)
    setTimeout(function() {
        window.location.href = downloadLink;  // Redirect to Google Drive for download
    }, 5000); // Simulated delay (in ms), adjust based on actual time needed
}
</script>

</body>
</html>
